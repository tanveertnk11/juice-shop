name: Test and Build the docker image
on:
  push:
    branches:
      - dev
      - master
  pull_request:
    branches:
      - master
env:
  NODE_DEFAULT_VERSION: 24.21.0
  GAR_LOCATION: us-east1
  REPOSITORY: docker
  APP: juice-shop
jobs:
  test:
    environment: dev
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    container:
      # A Docker image with Semgrep installed. Do not change this.
      image: semgrep/semgrep
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - name: Run gitleaks to check secrets exposure
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - parallel:
          - name: nodejsscan scan
            id: njsscan
            continue-on-error: true
            uses: ajinabraham/njsscan-action@231750a435d85095d33be7d192d52ec650625146 # v9
            with:
              args: "."
          - name: Perform Semgrep Analysis
            # @NOTE: This is the actual semgrep command to scan your code.
            # Modify the --config option to 'r/all' to scan using all rules,
            # or use multiple flags to specify particular rules, such as
            # --config r/all --config custom/rules
            run: semgrep scan --config p/javascript . --metrics=off
      - name: Setup nodejs
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_DEFAULT_VERSION }}
          cache: "npm"
      # - name: Cache node modules
      #   id: cache-dependencies
      #   uses: actions/cache@v6
      #   with:
      #     path: node_modules
      #     key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
      #     restore-keys: |
      #       ${{ runner.os }}-build-${{ env.cache-name }}-
      #       ${{ runner.os }}-build-
      #       ${{ runner.os }}-
      - name: Install dependencies
        run: npm install

      - name: Run Tests
        run: npm run test
      - name: Authenticate to Google
        uses: "google-github-actions/auth@v3"
        with:
          project_id: ${{ vars.PROJECT_ID }}
          workload_identity_provider: "projects/${{ vars.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions/providers/github-provider"
          service_account: ${{ vars.SERVICE_ACCOUNT_NAME }}
      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v3"
        with:
          project_id: "${{ vars.PROJECT_ID }}"

      - name: "Docker auth"
        run: |-
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

      - name: "Build and push container"
        run: |-
          docker build -t "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.APP }}:${{ github.sha }}" .
          docker push "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.APP }}:${{ github.sha }}"
