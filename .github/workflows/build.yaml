name: Test and Build the docker image
on:
  push:
    branches:
      - dev
      - master
  pull_request:
    branches:
      - master
env:
  NODE_DEFAULT_VERSION: 24.21.0
  GAR_LOCATION: us-east1
  REPOSITORY: docker
  APP: juice-shop
jobs:
  test:
    environment: dev
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - parallel:
          - name: Run gitleaks to check secrets exposure
            # gitleaks-action only ever scans the pushed commit range on push/PR
            # events, so the CLI is called directly to scan the whole repository.
            continue-on-error: true
            uses: docker://zricethezav/gitleaks:latest
            with:
              args: detect --source . --report-format=sarif --report-path=./gitleaks.sarif
          - name: njsscan
            id: njsscan
            continue-on-error: true
            uses: ajinabraham/njsscan-action@231750a435d85095d33be7d192d52ec650625146 # v9
            with:
              args: ". --sarif --output njsscan.sarif || true"
          - name: Perform Semgrep Analysis
            uses: docker://semgrep/semgrep:latest
            # @NOTE: This is the actual semgrep command to scan your code.
            # Modify the --config option to 'r/all' to scan using all rules,
            # or use multiple flags to specify particular rules, such as
            # --config r/all --config custom/rules
            with:
              args: semgrep scan --config p/javascript . --metrics=off --json --output=semgrep.json
      - name: Setup nodejs
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_DEFAULT_VERSION }}
          cache: "npm"
      - name: Install dependencies
        run: npm install
      - name: SCA Analysis with Retirejs
        continue-on-error: true
        run: |-
          npm instal -g retire
          retire --path . --outputformat json --outputpath ./retirejs.json
      - name: Upload Scan Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: security-scan-reports
          path: |
            njsscan.sarif
            semgrep.json
            gitleaks.sarif
            retirejs.json
      - name: Upload scan report to defect dojo
        if: always()
        run: |-
          pip install requests
          python3 upload-scan-defectdojo.py gitleaks.sarif
          python3 upload-scan-defectdojo.py njsscan.sarif
          python3 upload-scan-defectdojo.py semgrep.json
          python3 upload-scan-defectdojo.py retirejs.json
      # - name: Cache node modules
      #   id: cache-dependencies
      #   uses: actions/cache@v6
      #   with:
      #     path: node_modules
      #     key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
      #     restore-keys: |
      #       ${{ runner.os }}-build-${{ env.cache-name }}-
      #       ${{ runner.os }}-build-
      #       ${{ runner.os }}-
      - name: Run Tests
        run: npm run test
      - name: Authenticate to Google
        uses: "google-github-actions/auth@v3"
        with:
          project_id: ${{ vars.PROJECT_ID }}
          workload_identity_provider: "projects/${{ vars.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions/providers/github-provider"
          service_account: ${{ vars.SERVICE_ACCOUNT_NAME }}
      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v3"
        with:
          project_id: "${{ vars.PROJECT_ID }}"

      - name: "Docker auth"
        run: |-
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

      - name: "Build and push container"
        run: |-
          docker build -t "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.APP }}:${{ github.sha }}" .
          docker push "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.APP }}:${{ github.sha }}"
