  build:
    environment: dev
    # needs:
    #   - security-scan
    #   - test
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    outputs:
      IMAGE_NAME: ${{ steps.build-push.outputs.IMAGE_NAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Authenticate to Google
        uses: "google-github-actions/auth@v3"
        with:
          project_id: ${{ vars.PROJECT_ID }}
          workload_identity_provider: "projects/${{ vars.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions/providers/github-provider"
          service_account: ${{ vars.SERVICE_ACCOUNT_NAME }}
      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v3"
        with:
          project_id: "${{ vars.PROJECT_ID }}"

      - name: "Docker auth"
        run: |-
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev
      - name: "Build and push container"
        id: build-push
        env:
          IMAGE_NAME: "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.APP }}"
        run: |-
          docker build -t "${{ env.IMAGE_NAME }}:${{ github.sha }}" -t "${{ env.IMAGE_NAME }}:latest" .
          docker push "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker push "${{ env.IMAGE_NAME }}:latest"
          echo "IMAGE_NAME=${{ env.IMAGE_NAME }}" >> $GITHUB_OUTPUT

  deploy:
    # needs: build
    environment: dev
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Authenticate to Google
        uses: "google-github-actions/auth@v3"
        with:
          project_id: ${{ vars.PROJECT_ID }}
          workload_identity_provider: "projects/${{ vars.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions/providers/github-provider"
          service_account: ${{ vars.SERVICE_ACCOUNT_NAME }}
      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v3"
        with:
          project_id: "${{ vars.PROJECT_ID }}"
      - name: "SSH instance"
        env:
          IMAGE_NAME: ${{ needs.build.outputs.IMAGE_NAME }}
        run: |-
          gcloud compute ssh "$APP_NAME" \
            --zone=us-east1-b \
            --quiet \
            --ssh-flag="-T" << EOF
              set -euo pipefail

              # Fix: Run docker login as sudo so that the subsequent 'sudo docker pull' can use it
              gcloud auth print-access-token | sudo docker login -u oauth2accesstoken --password-stdin "https://$GAR_REGISTRY"

              # Deploy operations
              sudo docker pull "$IMAGE_NAME"
              sudo docker rm -f "$APP_NAME" || true
              sudo docker run -d --restart unless-stopped \
                --name "$APP_NAME" \
                -p 80:3000 \
                "$IMAGE_NAME"
          EOF
